name: Combo OS CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build (Edge API + Cloudflare Pages)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Run Edge Invariant & API Tests (73 Checks)
        run: node --experimental-strip-types scripts/test-edge.mjs

      - name: Typecheck Worker API (tsc)
        run: npm --workspace=apps/worker-api run build

      - name: Build Cloudflare Pages Static Export
        run: npm --workspace=apps/hub run build

      - name: Verify Cloudflare Pages Output Directory
        run: ls -la apps/hub/out

      - name: Deploy to Cloudflare Pages & Workers (Production)
        if: (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main') && github.event_name == 'push'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Deploying Static Frontend to Cloudflare Pages..."
            npx wrangler pages deploy apps/hub/out --project-name=combo-hub --force --commit-dirty=true
            echo "Deploying Backend Worker API..."
            cd apps/worker-api && npx wrangler deploy
          else
            echo "Notice: CLOUDFLARE_API_TOKEN secret not set in GitHub repository settings."
            echo "To enable zero-click auto-deploy from GitHub Actions, add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings -> Secrets and variables -> Actions."
          fi
