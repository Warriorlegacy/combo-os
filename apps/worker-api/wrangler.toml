name = "combo-worker-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare D1 Database Binding
[[d1_databases]]
binding = "COMBO_DB"
database_name = "combo-production-db"
database_id = "8fa9bb12-1be9-4776-afbc-c7c1da0a9114"
migrations_dir = "src/db"

# Cloudflare R2 Storage Binding (Enable after turning on R2 in Cloudflare dashboard)
# [[r2_buckets]]
# binding = "COMBO_BUCKET"
# bucket_name = "combo-production-storage"

# Cloudflare Workers AI Binding
[ai]
binding = "AI"

# Scheduled Cron Trigger (Executes daily at 09:00 UTC Mon-Fri on free tier)
[triggers]
crons = ["0 9 * * 1-5"]

[vars]
ENVIRONMENT = "production"
DEFAULT_MODEL = "@cf/meta/llama-3.3-70b-instruct"

